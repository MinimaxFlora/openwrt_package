name: Build OpenWrt Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt SDK 版本：auto = 自动检测最新 24.x 和 25.x"
        type: choice
        options:
          - auto
          - "24.10.8"
          - "25.12.5"
        default: auto
      arch_generic:
        description: "架构 aarch64_generic（通用 ARM64）"
        type: boolean
        default: true
      arch_cortex_a53:
        description: "架构 aarch64_cortex-a53（Cortex-A53 设备）"
        type: boolean
        default: true
      arch_x86_64:
        description: "架构 x86_64（软路由 / PC）"
        type: boolean
        default: true
      packages:
        description: "要编译的包名（空格分隔，如 luci-theme-argon mosdns luci-app-mosdns v2dat）；留空 = 编译全部 45 个包"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 确定要编译的 SDK 版本列表 ----
  detect:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - name: Detect OpenWrt versions
        id: detect
        run: |
          if [ "${{ inputs.version }}" != "auto" ]; then
            echo "versions=[\"${{ inputs.version }}\"]" >> "$GITHUB_OUTPUT"
          else
            TAGS=$(curl -s "https://api.github.com/repos/openwrt/openwrt/tags?per_page=100")
            V24=$(echo "$TAGS" | grep -oE '"name": "v24\.10\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
            V25=$(echo "$TAGS" | grep -oE '"name": "v25\.12\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
            echo "Latest: 24.x=$V24 25.x=$V25"
            echo "versions=[\"$V24\",\"$V25\"]" >> "$GITHUB_OUTPUT"
          fi

  # ---- 按 架构 x 版本 矩阵编译 ----
  build:
    needs: detect
    name: ${{ matrix.arch }} @ ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
        version: ${{ fromJSON(needs.detect.outputs.versions) }}
    # 只跑用户勾选的架构
    if: |
      (inputs.arch_generic && matrix.arch == 'aarch64_generic') ||
      (inputs.arch_cortex_a53 && matrix.arch == 'aarch64_cortex-a53') ||
      (inputs.arch_x86_64 && matrix.arch == 'x86_64')
    env:
      ARCH: ${{ matrix.arch }}
      TAG: ${{ matrix.arch }}-${{ matrix.version }}

    steps:
      - name: Free disk space
        uses: sbwml/actions@free-disk

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 包列表：填了就用填的，没填就全部 45 个 ----
      - name: Build package selection
        id: select
        run: |
          ALL_PKGS="airconnect bandix-plus chinadns-ng dns2socks geoview hysteria ipt2socks luci-app-airconnect luci-app-argon-config luci-app-aurora-config luci-app-bandix-plus luci-app-diskman luci-app-homeproxy luci-app-kucat-config luci-app-mentohust luci-app-mosdns luci-app-nikki luci-app-openclash luci-app-openlist2 luci-app-passwall luci-app-passwall2 luci-app-quickfile luci-app-ramfree luci-theme-argon luci-theme-aurora luci-theme-design luci-theme-kucat luci-theme-shadcn mentohust microsocks mihomo-meta mosdns naiveproxy nikki openlist2 quickfile shadowsocksr-libev shadowsocks-rust shadow-tls simple-obfs sing-box tcping v2dat v2ray-geodata v2ray-plugin xray-core xray-plugin"

          INPUT="${{ inputs.packages }}"
          if [ -n "$INPUT" ]; then
            PKGS="$(echo "$INPUT" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' | sed 's/ $//')"
            GROUPS="自定义: $PKGS"
          else
            PKGS="$ALL_PKGS"
            GROUPS="全部 45 个包"
          fi

          echo "PACKAGES=$PKGS" >> "$GITHUB_ENV"
          echo "SELECTED=$GROUPS" >> "$GITHUB_ENV"
          echo "Selected packages: $PKGS"

      # ---- 用官方 SDK 镜像编译（openwrt/gh-action-sdk）----
      - name: Build Packages (${{ matrix.arch }}-${{ matrix.version }})
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ env.ARCH }}-${{ matrix.version }}
          FEEDNAME: action
          PACKAGES: ${{ env.PACKAGES }}
          IGNORE_ERRORS: "true"
          NO_REFRESH_CHECK: "true"
          BUILD_LOG: "1"
          INDEX: "1"
          V: "s"

      # ---- 收集产物（ipk/apk + 包索引 + tar.gz）----
      - name: Collect packages
        run: |
          mkdir -p release
          find bin -type f \( -name '*.ipk' -o -name '*.apk' -o -name 'Packages*' -o -name 'APKINDEX*' \) -exec cp {} release/ \; || true
          if [ -n "$(ls -A release)" ]; then
            tar -czf "$TAG.tar.gz" -C release .
            mv "$TAG.tar.gz" release/
          else
            echo "构建无产物" > release/EMPTY.txt
          fi
          ls -lh release/

      # ---- 按架构名创建 tag + release，上传 ipk/apk ----
      - name: Create tag & release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            OpenWrt ${{ matrix.version }} · ${{ matrix.arch }}
            插件: ${{ env.SELECTED }}
            由手动触发构建生成
          files: release/**/*
          update_existing: true
          fail_on_unmatched_files: false
