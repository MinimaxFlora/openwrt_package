name: Build OpenWrt Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "选择要编译的插件"
        type: choice
        options:
          - "全部 45 个包"
          - "Argon 主题"
          - "Kucat 主题"
          - "Aurora 主题"
          - "Design 主题"
          - "Shadcn 主题"
          - "全部主题"
          - "Mosdns DNS 转换器"
          - "OpenClash"
          - "HomeProxy"
          - "PassWall"
          - "PassWall2"
          - "Nikki"
          - "实用工具"
        default: "全部 45 个包"

permissions:
  contents: write

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 自动检测最新 24.x 和 25.x 版本 ----
  detect:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - name: Detect OpenWrt versions
        id: detect
        run: |
          TAGS=$(curl -s "https://api.github.com/repos/openwrt/openwrt/tags?per_page=100")
          V24=$(echo "$TAGS" | grep -oE '"name": "v24\.10\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          V25=$(echo "$TAGS" | grep -oE '"name": "v25\.12\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Latest: 24.x=$V24 25.x=$V25"
          echo "versions=[\"$V24\",\"$V25\"]" >> "$GITHUB_OUTPUT"

  # ---- 固定三个架构 x 检测到的版本 编译 ----
  build:
    needs: detect
    name: ${{ matrix.arch }} @ ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
        version: ${{ fromJSON(needs.detect.outputs.versions) }}
    env:
      ARCH: ${{ matrix.arch }}
      TAG: ${{ matrix.arch }}-${{ matrix.version }}

    steps:
      - name: Free disk space
        uses: sbwml/actions@free-disk

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 根据下拉选择映射包列表 ----
      - name: Build package selection
        id: select
        run: |
          ALL_PKGS="airconnect bandix-plus chinadns-ng dns2socks geoview hysteria ipt2socks luci-app-airconnect luci-app-argon-config luci-app-aurora-config luci-app-bandix-plus luci-app-diskman luci-app-homeproxy luci-app-kucat-config luci-app-mentohust luci-app-mosdns luci-app-nikki luci-app-openclash luci-app-openlist2 luci-app-passwall luci-app-passwall2 luci-app-quickfile luci-app-ramfree luci-theme-argon luci-theme-aurora luci-theme-design luci-theme-kucat luci-theme-shadcn mentohust microsocks mihomo-meta mosdns naiveproxy nikki openlist2 quickfile shadowsocksr-libev shadowsocks-rust shadow-tls simple-obfs sing-box tcping v2dat v2ray-geodata v2ray-plugin xray-core xray-plugin"

          case "${{ inputs.packages }}" in
            "Argon 主题")
              PKGS="luci-theme-argon luci-app-argon-config"
              ;;
            "Kucat 主题")
              PKGS="luci-theme-kucat luci-app-kucat-config"
              ;;
            "Aurora 主题")
              PKGS="luci-theme-aurora luci-app-aurora-config"
              ;;
            "Design 主题")
              PKGS="luci-theme-design"
              ;;
            "Shadcn 主题")
              PKGS="luci-theme-shadcn"
              ;;
            "全部主题")
              PKGS="luci-theme-argon luci-app-argon-config luci-theme-kucat luci-app-kucat-config luci-theme-aurora luci-app-aurora-config luci-theme-design luci-theme-shadcn"
              ;;
            "Mosdns DNS 转换器")
              PKGS="mosdns luci-app-mosdns v2dat"
              ;;
            "OpenClash")
              PKGS="luci-app-openclash"
              ;;
            "HomeProxy")
              PKGS="luci-app-homeproxy"
              ;;
            "PassWall")
              PKGS="luci-app-passwall chinadns-ng dns2socks microsocks tcping xray-core xray-plugin sing-box hysteria naiveproxy shadowsocks-rust shadow-tls simple-obfs v2ray-geodata v2ray-plugin"
              ;;
            "PassWall2")
              PKGS="luci-app-passwall2 chinadns-ng dns2socks microsocks tcping xray-core xray-plugin sing-box hysteria naiveproxy shadowsocks-rust shadow-tls simple-obfs v2ray-geodata v2ray-plugin"
              ;;
            "Nikki")
              PKGS="luci-app-nikki mihomo-meta"
              ;;
            "实用工具")
              PKGS="luci-app-diskman luci-app-mentohust mentohust luci-app-quickfile quickfile luci-app-ramfree luci-app-bandix-plus bandix-plus luci-app-openlist2 openlist2 luci-app-airconnect airconnect"
              ;;
            *)
              PKGS="$ALL_PKGS"
              ;;
          esac

          echo "PACKAGES=$PKGS" >> "$GITHUB_ENV"
          echo "SELECTED=${{ inputs.packages }}" >> "$GITHUB_ENV"
          echo "Selected packages: $PKGS"

      # ---- 用官方 SDK 镜像编译（openwrt/gh-action-sdk）----
      - name: Build Packages (${{ matrix.arch }}-${{ matrix.version }})
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ env.ARCH }}-${{ matrix.version }}
          FEEDNAME: action
          PACKAGES: ${{ env.PACKAGES }}
          IGNORE_ERRORS: "true"
          NO_REFRESH_CHECK: "true"
          BUILD_LOG: "1"
          INDEX: "1"
          V: "s"

      # ---- 收集产物（ipk/apk + 包索引 + tar.gz）----
      - name: Collect packages
        run: |
          mkdir -p release
          find bin -type f \( -name '*.ipk' -o -name '*.apk' -o -name 'Packages*' -o -name 'APKINDEX*' \) -exec cp {} release/ \; || true
          if [ -n "$(ls -A release)" ]; then
            tar -czf "$TAG.tar.gz" -C release .
            mv "$TAG.tar.gz" release/
          else
            echo "构建无产物" > release/EMPTY.txt
          fi
          ls -lh release/

      # ---- 按架构名创建 tag + release，上传 ipk/apk ----
      - name: Create tag & release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            OpenWrt ${{ matrix.version }} · ${{ matrix.arch }}
            插件: ${{ env.SELECTED }}
            由手动触发构建生成
          files: release/**/*
          update_existing: true
          fail_on_unmatched_files: false
