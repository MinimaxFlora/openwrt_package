name: Build OpenWrt Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: OpenWrt SDK 版本
        type: choice
        options:
          - both
          - "24.10.8"
          - "25.12.5"
        default: both
      arch_generic:
        description: "架构 aarch64_generic（通用 ARM64）"
        type: boolean
        default: true
      arch_cortex_a53:
        description: "架构 aarch64_cortex-a53（Cortex-A53 设备）"
        type: boolean
        default: true
      arch_x86_64:
        description: "架构 x86_64（软路由 / PC）"
        type: boolean
        default: true
      argon:
        description: "Argon 主题: luci-theme-argon + luci-app-argon-config"
        type: boolean
        default: false
      mosdns:
        description: "Mosdns DNS 转换器: mosdns + luci-app-mosdns + v2dat"
        type: boolean
        default: false
      openclash:
        description: "OpenClash: luci-app-openclash"
        type: boolean
        default: false
      homeproxy:
        description: "HomeProxy: luci-app-homeproxy"
        type: boolean
        default: false
      passwall:
        description: "PassWall: luci-app-passwall + 代理内核（xray/sing-box 等）"
        type: boolean
        default: false
      passwall2:
        description: "PassWall2: luci-app-passwall2 + 代理内核"
        type: boolean
        default: false
      nikki:
        description: "Nikki: luci-app-nikki + mihomo-meta"
        type: boolean
        default: false
      themes:
        description: "其他主题: Aurora / Kucat / Design / Shadcn"
        type: boolean
        default: false
      tools:
        description: "实用工具: diskman / mentohust / quickfile / ramfree / bandix / openlist2 / airconnect"
        type: boolean
        default: false
      all:
        description: "全部 45 个包（忽略以上勾选）"
        type: boolean
        default: false
      extra_packages:
        description: "额外包名（空格分隔，可选，如：shadowsocksr-libev sing-box）"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.arch }} @ ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
        version: ["24.10.8", "25.12.5"]
    # 只跑用户勾选的 架构 x 版本 组合
    if: |
      ( (inputs.arch_generic && matrix.arch == 'aarch64_generic') ||
        (inputs.arch_cortex_a53 && matrix.arch == 'aarch64_cortex-a53') ||
        (inputs.arch_x86_64 && matrix.arch == 'x86_64') ) &&
      ( inputs.version == 'both' || inputs.version == matrix.version )
    env:
      ARCH: ${{ matrix.arch }}
      TAG: ${{ matrix.arch }}-${{ matrix.version }}

    steps:
      - name: Free disk space
        uses: sbwml/actions@free-disk

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 根据勾选生成 PACKAGES 列表（本仓库就是包源 feed）----
      - name: Build package selection
        id: select
        run: |
          PKGS=""
          GROUPS=""

          if [ "${{ inputs.all }}" = "true" ]; then
            PKGS="airconnect bandix-plus chinadns-ng dns2socks geoview hysteria ipt2socks luci-app-airconnect luci-app-argon-config luci-app-aurora-config luci-app-bandix-plus luci-app-diskman luci-app-homeproxy luci-app-kucat-config luci-app-mentohust luci-app-mosdns luci-app-nikki luci-app-openclash luci-app-openlist2 luci-app-passwall luci-app-passwall2 luci-app-quickfile luci-app-ramfree luci-theme-argon luci-theme-aurora luci-theme-design luci-theme-kucat luci-theme-shadcn mentohust microsocks mihomo-meta mosdns naiveproxy nikki openlist2 quickfile shadowsocksr-libev shadowsocks-rust shadow-tls simple-obfs sing-box tcping v2dat v2ray-geodata v2ray-plugin xray-core xray-plugin"
            GROUPS="全部"
          else
            if [ "${{ inputs.argon }}" = "true" ]; then
              PKGS="$PKGS luci-theme-argon luci-app-argon-config"
              GROUPS="$GROUPS Argon"
            fi
            if [ "${{ inputs.mosdns }}" = "true" ]; then
              PKGS="$PKGS mosdns luci-app-mosdns v2dat"
              GROUPS="$GROUPS Mosdns"
            fi
            if [ "${{ inputs.openclash }}" = "true" ]; then
              PKGS="$PKGS luci-app-openclash"
              GROUPS="$GROUPS OpenClash"
            fi
            if [ "${{ inputs.homeproxy }}" = "true" ]; then
              PKGS="$PKGS luci-app-homeproxy"
              GROUPS="$GROUPS HomeProxy"
            fi
            if [ "${{ inputs.passwall }}" = "true" ]; then
              PKGS="$PKGS luci-app-passwall chinadns-ng dns2socks microsocks tcping xray-core xray-plugin sing-box hysteria naiveproxy shadowsocks-rust shadow-tls simple-obfs v2ray-geodata v2ray-plugin"
              GROUPS="$GROUPS PassWall"
            fi
            if [ "${{ inputs.passwall2 }}" = "true" ]; then
              PKGS="$PKGS luci-app-passwall2 chinadns-ng dns2socks microsocks tcping xray-core xray-plugin sing-box hysteria naiveproxy shadowsocks-rust shadow-tls simple-obfs v2ray-geodata v2ray-plugin"
              GROUPS="$GROUPS PassWall2"
            fi
            if [ "${{ inputs.nikki }}" = "true" ]; then
              PKGS="$PKGS luci-app-nikki mihomo-meta"
              GROUPS="$GROUPS Nikki"
            fi
            if [ "${{ inputs.themes }}" = "true" ]; then
              PKGS="$PKGS luci-theme-aurora luci-app-aurora-config luci-theme-kucat luci-app-kucat-config luci-theme-design luci-theme-shadcn"
              GROUPS="$GROUPS Themes"
            fi
            if [ "${{ inputs.tools }}" = "true" ]; then
              PKGS="$PKGS luci-app-diskman luci-app-mentohust mentohust luci-app-quickfile quickfile luci-app-ramfree luci-app-bandix-plus bandix-plus luci-app-openlist2 openlist2 luci-app-airconnect airconnect"
              GROUPS="$GROUPS Tools"
            fi
            if [ -n "${{ inputs.extra_packages }}" ]; then
              PKGS="$PKGS ${{ inputs.extra_packages }}"
              GROUPS="$GROUPS Extra"
            fi
          fi

          # 去重
          PKGS="$(echo "$PKGS" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ' | sed 's/ $//')"
          GROUPS="$(echo "$GROUPS" | xargs)"

          if [ -z "$PKGS" ]; then
            echo "::error::请至少勾选一个插件组，或填写额外包名"
            exit 1
          fi

          echo "PACKAGES=$PKGS" >> "$GITHUB_ENV"
          echo "SELECTED=$GROUPS" >> "$GITHUB_ENV"
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"
          echo "Selected packages: $PKGS"

      # ---- 用官方 SDK 镜像编译（openwrt/gh-action-sdk）----
      - name: Build Packages (${{ matrix.arch }}-${{ matrix.version }})
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ env.ARCH }}-${{ matrix.version }}
          FEEDNAME: action
          PACKAGES: ${{ env.PACKAGES }}
          IGNORE_ERRORS: "true"
          NO_REFRESH_CHECK: "true"
          BUILD_LOG: "1"
          INDEX: "1"
          V: "s"

      # ---- 收集产物（ipk/apk + 包索引 + tar.gz）----
      - name: Collect packages
        run: |
          mkdir -p release
          find bin -type f \( -name '*.ipk' -o -name '*.apk' -o -name 'Packages*' -o -name 'APKINDEX*' \) -exec cp {} release/ \; || true
          if [ -n "$(ls -A release)" ]; then
            tar -czf "$TAG.tar.gz" -C release .
            mv "$TAG.tar.gz" release/
          else
            echo "构建无产物" > release/EMPTY.txt
          fi
          ls -lh release/

      # ---- 按架构名创建 tag + release，上传 ipk/apk ----
      - name: Create tag & release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            OpenWrt ${{ matrix.version }} · ${{ matrix.arch }}
            插件: ${{ env.SELECTED }}
            由手动触发构建生成
          files: release/**/*
          update_existing: true
          fail_on_unmatched_files: false
