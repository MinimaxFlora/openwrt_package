name: Build OpenWrt Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "选择要编译的插件"
        type: choice
        options:
          - "Argon 主题"
          - "Kucat 主题"
          - "Aurora 主题"
          - "Design 主题"
          - "Shadcn 主题"
          - "Mosdns DNS 转换器"
          - "OpenClash 代理插件"
          - "HomeProxy 代理插件"
          - "PassWall 代理插件"
          - "PassWall2 代理插件"
          - "Nikki 代理插件"
          - "代理内核组件"
          - "DiskMan 磁盘管理工具"
          - "MentoHUST 认证"
          - "Quickfile 文件管理"
          - "RamFree 内存清理"
          - "Bandix-Plus 网络流量监控"
          - "OpenList 网盘聚合工具"
          - "AirConnect 音频服务"
        default: "Argon 主题"

permissions:
  contents: write

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 自动检测最新 24.x 和 25.x 版本 ----
  detect:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - name: Detect OpenWrt versions
        id: detect
        run: |
          TAGS=$(curl -s "https://api.github.com/repos/openwrt/openwrt/tags?per_page=100")
          V24=$(echo "$TAGS" | grep -oE '"name": "v24\.10\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          V25=$(echo "$TAGS" | grep -oE '"name": "v25\.12\.[0-9]+"' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Latest: 24.x=$V24 25.x=$V25"
          echo "versions=[\"$V24\",\"$V25\"]" >> "$GITHUB_OUTPUT"

  # ---- 固定三个架构 x 检测到的版本 编译 ----
  build:
    needs: detect
    name: ${{ matrix.arch }} @ ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
        version: ${{ fromJSON(needs.detect.outputs.versions) }}
    env:
      ARCH: ${{ matrix.arch }}
      TAG: ${{ matrix.arch }}-${{ matrix.version }}

    steps:
      - name: Free disk space
        uses: sbwml/actions@free-disk

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- 根据下拉选择映射包列表，并定义 SKIP_BUILD ----
      - name: Build package selection
        id: select
        run: |
          case "${{ inputs.packages }}" in
            "Argon 主题")
              PKGS="luci-theme-argon luci-app-argon-config"
              ;;
            "Kucat 主题")
              PKGS="luci-theme-kucat luci-app-kucat-config"
              ;;
            "Aurora 主题")
              PKGS="luci-theme-aurora luci-app-aurora-config"
              ;;
            "Design 主题")
              PKGS="luci-theme-design"
              ;;
            "Shadcn 主题")
              PKGS="luci-theme-shadcn"
              ;;
            "Mosdns DNS 转换器")
              PKGS="mosdns luci-app-mosdns v2dat"
              ;;
            "OpenClash 代理插件")
              PKGS="luci-app-openclash"
              ;;
            "HomeProxy 代理插件")
              PKGS="luci-app-homeproxy"
              ;;
            "PassWall 代理插件")
              PKGS="luci-app-passwall chinadns-ng dns2socks microsocks tcping xray-core xray-plugin sing-box hysteria naiveproxy shadowsocks-rust shadow-tls simple-obfs v2ray-geodata v2ray-plugin"
              ;;
            "PassWall2 代理插件")
              PKGS="luci-app-passwall2 chinadns-ng dns2socks microsocks tcping xray-core xray-plugin sing-box hysteria naiveproxy shadowsocks-rust shadow-tls simple-obfs v2ray-geodata v2ray-plugin"
              ;;
            "Nikki 代理插件")
              PKGS="luci-app-nikki mihomo-meta"
              ;;
            "代理内核组件")
              PKGS="chinadns-ng dns2socks microsocks tcping xray-core xray-plugin sing-box hysteria naiveproxy shadowsocks-rust shadow-tls simple-obfs v2ray-geodata v2ray-plugin"
              ;;
            "DiskMan 磁盘管理工具")
              PKGS="luci-app-diskman"
              ;;
            "MentoHUST 认证")
              PKGS="luci-app-mentohust mentohust"
              ;;
            "Quickfile 文件管理")
              PKGS="luci-app-quickfile quickfile"
              ;;
            "RamFree 内存清理")
              PKGS="luci-app-ramfree"
              ;;
            "Bandix-Plus 网络流量监控")
              PKGS="luci-app-bandix-plus bandix-plus"
              ;;
            "OpenList 网盘聚合工具")
              PKGS="luci-app-openlist2 openlist2"
              ;;
            "AirConnect 音频服务")
              PKGS="luci-app-airconnect airconnect"
              ;;
            *)
              echo "::error::未识别的选项：${{ inputs.packages }}"
              exit 1
              ;;
          esac

          # 不跳过任何架构/版本
          echo "SKIP_BUILD=0" >> "$GITHUB_ENV"
          echo "PACKAGES=$PKGS" >> "$GITHUB_ENV"
          echo "SELECTED=${{ inputs.packages }}" >> "$GITHUB_ENV"
          echo "Selected packages: $PKGS"

      # ---- 用 SDK 镜像编译（MinimaxFlora/gh-action-sdk@go1.26）----
      - name: Build Packages
        if: ${{ env.SKIP_BUILD == '0' }}
        uses: MinimaxFlora/gh-action-sdk@go1.26
        env:
          FEEDNAME: packages_ci
          PACKAGES: ${{ env.PACKAGES }}
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: true

      # ---- 收集产物（ipk/apk + tar.gz）----
      - name: Collect packages
        run: |
          mkdir -p release
          find bin -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} release/ \; || true
          if [ -n "$(ls -A release)" ]; then
            tar -czf "$TAG.tar.gz" -C release .
            mv "$TAG.tar.gz" release/
          else
            echo "构建无产物" > release/EMPTY.txt
          fi
          ls -lh release/

      # ---- 按架构名创建 tag + release，上传 ipk/apk ----
      - name: Create tag & release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            OpenWrt ${{ matrix.version }} · ${{ matrix.arch }}
            插件: ${{ env.SELECTED }}
            由手动触发构建生成
          files: release/**/*
          update_existing: true
          fail_on_unmatched_files: false
