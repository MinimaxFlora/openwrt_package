name: Build OpenWrt Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "选择要编译的插件"
        type: choice
        options:
          - "🌈 全部（一次编译所有插件，推荐）"
          - "🎨 Argon 主题"
          - "🎨 Vantage 主题"
          - "🎨 Aurora 主题"
          - "🎨 Design 主题"
          - "🎨 Shadcn 主题"
          - "🎨 Fluent 主题"
          - "🔀 Mosdns DNS 转换器"
          - "🚀 OpenClash 代理插件"
          - "🚀 HomeProxy 代理插件"
          - "🚀 PassWall 代理插件"
          - "🚀 PassWall2 代理插件"
          - "🚀 Nikki 代理插件（nikki + mihomo 内核）"
          - "🧩 HelloWorld 代理内核组件"
          - "🔧 DiskMan 磁盘管理工具"
          - "🔧 MentoHUST 认证"
          - "🔧 Quickfile 文件管理"
          - "🔧 RamFree 内存清理"
          - "🔧 Bandix-Plus 网络流量监控"
          - "🔧 OpenList 网盘聚合工具"
          - "🔧 AirConnect 音频服务"
          - "🌡️ Autocore 硬件信息"
        default: "🌈 全部（一次编译所有插件，推荐）"

permissions:
  contents: write

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 自动检测最新 24.x 和 25.x 版本（官方 .versions.json，一次请求）----
  detect:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - name: Detect OpenWrt versions
        id: detect
        run: |
          set -euo pipefail
          V=$(curl -fsS --retry 3 --retry-delay 3 https://downloads.openwrt.org/.versions.json)
          V25=$(python3 -c 'import json,sys;print(json.load(sys.stdin)["stable_version"])' <<<"$V")
          V24=$(python3 -c 'import json,sys;print(json.load(sys.stdin)["oldstable_version"])' <<<"$V")
          # 格式兜底 + 只接受 x.y.z
          [[ "$V24" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V24="24.10.8"
          [[ "$V25" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V25="25.12.6"
          echo "Latest: 24.x=$V24  25.x=$V25"
          echo "versions=[\"$V24\",\"$V25\"]" >> "$GITHUB_OUTPUT"

  # ---- 编译：三架构 x 版本矩阵，只产出 ipk/apk 并上传 artifact ----
  build:
    needs: detect
    name: Build ${{ matrix.arch }} @ ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
        version: ${{ fromJSON(needs.detect.outputs.versions) }}
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Free disk space
        uses: sbwml/actions@free-disk

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # ---- tools/ 是 CI 依赖（列表/来源快照都靠它），被误删时给一句人话 ----
      - name: Check tools
        run: |
          for f in tools/pkgscan.py tools/list-packages.py tools/gen-lock.py; do
            [ -f "$f" ] || { echo "::error::缺少 $f —— tools/ 是 CI 依赖，同步脚本不要删除它"; exit 1; }
          done

      # ---- 包来源快照必须和 Makefile 同步（改了版本忘了更新 lock 就在这里红）----
      - name: Verify packages.lock.json
        run: python3 tools/gen-lock.py --check

      # ---- 根据下拉选择映射包列表，并定义 SKIP_BUILD ----
      - name: Build package selection
        id: select
        run: |
          case "${{ inputs.packages }}" in
            "🌈 全部（一次编译所有插件，推荐）")
              # 直接从仓库真实 Makefile 生成（输出的是包目录名，SDK 按目录编译）。
              # 以前手写的列表里有已删除的 luci-theme-kucat、从未存在的
              # luci-app-nikki / mihomo-meta，还把 autocore-x86 这种包名当目录名用，
              # 结果整轮 No rule to make target。
              PKGS="$(python3 tools/list-packages.py)"
              ;;
            "🎨 Argon 主题")
              PKGS="luci-theme-argon luci-app-argon-config"
              ;;
            "🎨 Vantage 主题")
              PKGS="luci-theme-vantage luci-app-vantage"
              ;;
            "🎨 Aurora 主题")
              PKGS="luci-theme-aurora luci-app-aurora-config"
              ;;
            "🎨 Design 主题")
              PKGS="luci-theme-design"
              ;;
            "🎨 Shadcn 主题")
              PKGS="luci-theme-shadcn"
              ;;
            "🎨 Fluent 主题")
              PKGS="luci-theme-fluent"
              ;;
            "🔀 Mosdns DNS 转换器")
              PKGS="mosdns luci-app-mosdns"
              ;;
            "🚀 OpenClash 代理插件")
              PKGS="luci-app-openclash"
              ;;
            "🚀 HomeProxy 代理插件")
              PKGS="luci-app-homeproxy"
              ;;
            "🚀 PassWall 代理插件")
              PKGS="luci-app-passwall"
              ;;
            "🚀 PassWall2 代理插件")
              PKGS="luci-app-passwall2"
              ;;
            "🚀 Nikki 代理插件（nikki + mihomo 内核）")
              # nikki 的 DEPENDS 里有 +mihomo，由 mihomo-meta 提供
              PKGS="nikki mihomo-meta luci-app-nikki"
              ;;
            "🧩 HelloWorld 代理内核组件")
              PKGS="chinadns-ng dns2socks microsocks tcping xray-core xray-plugin sing-box hysteria naiveproxy shadowsocks-rust shadow-tls simple-obfs-client simple-obfs-server v2ray-geoip v2ray-geosite v2ray-plugin"
              ;;
            "🔧 DiskMan 磁盘管理工具")
              PKGS="luci-app-diskman"
              ;;
            "🔧 MentoHUST 认证")
              PKGS="luci-app-mentohust mentohust"
              ;;
            "🔧 Quickfile 文件管理")
              PKGS="luci-app-quickfile quickfile"
              ;;
            "🔧 RamFree 内存清理")
              PKGS="luci-app-ramfree"
              ;;
            "🔧 Bandix-Plus 网络流量监控")
              PKGS="luci-app-bandix-plus bandix-plus"
              ;;
            "🔧 OpenList 网盘聚合工具")
              PKGS="luci-app-openlist2 openlist2"
              ;;
            "🔧 AirConnect 音频服务")
              PKGS="luci-app-airconnect airconnect"
              ;;
            "🌡️ Autocore 硬件信息")
              # autocore 目录会按目标架构自动只编出 autocore-x86 或 autocore-arm
              PKGS="autocore"
              ;;
            *)
              echo "::error::未识别的选项：${{ inputs.packages }}"
              exit 1
              ;;
          esac

          # 不跳过任何架构/版本
          echo "SKIP_BUILD=0" >> "$GITHUB_ENV"
          echo "PACKAGES=$PKGS" >> "$GITHUB_ENV"
          echo "SELECTED=${{ inputs.packages }}" >> "$GITHUB_ENV"
          echo "Selected packages: $PKGS"

      # ---- 断言：选中的包名必须真实存在（防止列表和仓库再次脱节）----
      - name: Validate selected packages
        run: |
          set -uo pipefail
          python3 tools/list-packages.py | tr ' ' '\n' | grep -v '^$' | sort -u > /tmp/known.txt
          bad=0
          for p in $PACKAGES; do
            grep -qxF "$p" /tmp/known.txt || { echo "::error::仓库里没有包: $p"; bad=1; }
          done
          if [ "$bad" -ne 0 ]; then
            echo "仓库现有包："; sed 's/^/  /' /tmp/known.txt
            exit 1
          fi
          echo "选中 $(wc -w <<<"$PACKAGES") 个包，全部存在于仓库"

      # ---- 用 SDK 镜像编译（MinimaxFlora/gh-action-sdk@go1.27；xray-core 需要 go 1.27）----
      - name: Build Packages
        if: ${{ env.SKIP_BUILD == '0' }}
        uses: MinimaxFlora/gh-action-sdk@go1.27
        env:
          ARCH: ${{ env.ARCH }}-${{ matrix.version }}
          FEEDNAME: packages_ci
          PACKAGES: ${{ env.PACKAGES }}
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: true

      # ---- 只收集本仓库编译的产物（packages_ci + nonshared 包），不打包 ----
      - name: Collect packages
        run: |
          mkdir -p release
          # 常规包 (packages_ci feed)
          find "bin/packages/${{ env.ARCH }}/packages_ci" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} release/ \; || true
          # nonshared 包 (autocore 等): 输出在 bin/targets/, 只收集 autocore 产物避免混入系统依赖库
          find "bin/targets" -type f \( -name 'autocore*.ipk' -o -name 'autocore*.apk' \) -exec cp {} release/ \; || true
          if [ -z "$(ls -A release)" ]; then
            echo "构建无产物" > release/EMPTY.txt
          fi
          ls -lh release/

      # ---- 先把日志和产物传走，再做断言 ----
      # 断言放最后：这样即使断言红了，3 小时的编译结果也不会像上一轮那样全丢
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-logs-${{ matrix.arch }}-${{ matrix.version }}
          path: logs
          if-no-files-found: ignore

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages-${{ matrix.arch }}-${{ matrix.version }}
          path: release
          if-no-files-found: warn

      # ---- 断言：选定的每个构建目标都必须真的有产物 ----
      # 不按文件名猜包名：一个目录编出的包名经常和目录名无关
      #   shadowsocks-rust → sslocal/sserver/…、autocore → autocore-x86/arm、
      #   v2ray-geodata → v2ray-geoip/geosite、simple-obfs → client/server，
      # 而且 `sing-box-*` 这种 glob 会命中 sing-box-tiny，把 full 变体的失败掩盖掉。
      # tools/check-artifacts.py 读每个包自带的来源字段恢复映射：
      #   .ipk → control 的 `Source: /feed/<dir>`；.apk → adbdump 的 `origin:`
      # ---- 断言：选定的每个构建目标都必须真的有产物 ----
      # 不按文件名猜包名：一个目录编出的包名经常和目录名无关
      #   shadowsocks-rust → sslocal/sserver/…、autocore → autocore-x86/arm、
      #   v2ray-geodata → v2ray-geoip/geosite、simple-obfs → client/server，
      # 而且 `sing-box-*` 这种 glob 会命中 sing-box-tiny，把 full 变体的失败掩盖掉。
      # tools/check-artifacts.py 读每个包自带的来源字段恢复映射：
      #   .ipk → control 的 `Source: /feed/<dir>`；.apk → adbdump 的 `origin:`
      - name: Assert every selected package produced
        run: |
          set -uo pipefail
          # 别写 `ls ... | head`：在 bash -e + pipefail 下 head 提前关管道会让 ls
          # 报 "write error: Broken pipe" 并以 2 退出（上一轮就这么整步挂掉）
          ls -lh release/ | head -5 || true

          # .apk 的来源只能靠 `apk adbdump` 读，而宿主上没有 apk（SDK 在 sdk 镜像里）。
          # 所以：本地能找到 apk 就用本地的，否则借 Build Packages 刚构建出来的 sdk 镜像。
          APK_BIN=""
          for c in ${STAGING_DIR_HOST:+$STAGING_DIR_HOST/bin/apk} \
                   ${STAGING_DIR:+$(dirname "$(dirname "$STAGING_DIR")")/host/bin/apk} \
                   $GITHUB_WORKSPACE/staging_dir/host/bin/apk \
                   staging_dir/host/bin/apk \
                   $(ls -d */staging_dir/host/bin/apk */*/staging_dir/host/bin/apk 2>/dev/null || true) \
                   "$(command -v apk 2>/dev/null || true)"; do
            [ -n "$c" ] && [ -x "$c" ] && { APK_BIN="$c"; break; }
          done
          echo "本地 apk 工具: ${APK_BIN:-没有}"

          set +e
          if [ -n "$APK_BIN" ]; then
            python3 tools/check-artifacts.py release "$PACKAGES" --apk "$APK_BIN"
            rc=$?
          elif docker image inspect sdk >/dev/null 2>&1; then
            echo "改用 sdk 镜像里的 apk 读 .apk 元数据"
            docker run --rm --entrypoint bash \
              -v "$PWD:/w" -w /w -e PACKAGES="$PACKAGES" sdk \
              -lc 'python3 tools/check-artifacts.py release "$PACKAGES" || /usr/bin/python3 tools/check-artifacts.py release "$PACKAGES"'
            rc=$?
          else
            echo "::error::本机没有 apk，也没有可用的 sdk 镜像，无法判定 .apk 的来源（会误报缺包）"
            rc=3
          fi
          set -e

          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 3 ]; then
              echo "::group::诊断"
              echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
              echo "STAGING_DIR=${STAGING_DIR:-未设置} STAGING_DIR_HOST=${STAGING_DIR_HOST:-未设置}"
              docker image ls | head -5 || true
              echo "::endgroup::"
            fi
            echo "::group::编译日志里报错的部分（logs/）"
            if [ -d logs ]; then
              find logs -name '*.txt' -print0 | while IFS= read -r -d '' f; do
                if tail -30 "$f" | grep -qiE 'error|failed|does not exist|missing|\*\*\*'; then
                  echo "===== $f"; tail -40 "$f"
                fi
              done
            else
              echo "（没有 logs/ 目录，请看 build-logs artifact）"
            fi
            echo "::endgroup::"
            echo "::error::有构建目标没产出包，原因见上面的编译日志"
            exit 1
          fi

  # ---- 发布：按架构汇总 24.x + 25.x 产物，删除旧 release/tag 后重建 ----
  release:
    needs: [detect, build]
    name: Release ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
    env:
      TAG: ${{ matrix.arch }}

    steps:
      - name: Download all artifacts for ${{ matrix.arch }}
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: packages-${{ matrix.arch }}-*
          merge-multiple: true
          path: release

      - name: Check collected files
        run: ls -lh release/

      # ---- 先删除已有的 tag + release（每次重新创建，避免残留；减少 API 调用）----
      - name: Delete existing tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 不预检，直接尝试删除，不存在时忽略错误（省一次 API 调用）
          if gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null; then
            echo "已删除旧的 release/tag: $TAG"
          else
            echo "没有旧 release，直接创建: $TAG"
          fi

      # ---- 以架构名创建全新 tag + release，上传 ipk/apk ----
      - name: Create tag & release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            OpenWrt ${{ matrix.arch }} · 自动构建
            版本: ${{ join(fromJSON(needs.detect.outputs.versions), ' / ') }}
            插件: ${{ inputs.packages }}
            由手动触发构建生成
          files: release/**/*
          fail_on_unmatched_files: false
