name: Build OpenWrt Packages

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "选择要编译的插件"
        type: choice
        options:
          - "🎨 Argon 主题"
          - "🎨 Kucat 主题"
          - "🎨 Aurora 主题"
          - "🎨 Design 主题"
          - "🎨 Shadcn 主题"
          - "🔀 Mosdns DNS 转换器"
          - "🚀 OpenClash 代理插件"
          - "🚀 HomeProxy 代理插件"
          - "🚀 PassWall 代理插件"
          - "🚀 PassWall2 代理插件"
          - "🚀 Nikki 代理插件"
          - "🧩 HelloWorld 代理内核组件"
          - "🔧 DiskMan 磁盘管理工具"
          - "🔧 MentoHUST 认证"
          - "🔧 Quickfile 文件管理"
          - "🔧 RamFree 内存清理"
          - "🔧 Bandix-Plus 网络流量监控"
          - "🔧 OpenList 网盘聚合工具"
          - "🔧 AirConnect 音频服务"
          - "🌡️ Autocore 硬件信息"
        default: "🎨 Argon 主题"

permissions:
  contents: write

concurrency:
  group: openwrt-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 自动检测最新 24.x 和 25.x 版本 ----
  detect:
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - name: Detect OpenWrt versions
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 用 gh api（GITHUB_TOKEN）避免匿名 API 限流
          TAGS=$(gh api "repos/openwrt/openwrt/tags?per_page=100" --jq '.[].name')
          V24=$(echo "$TAGS" | grep -oE 'v24\.10\.[0-9]+' | sed 's/^v//' | sort -V | tail -1)
          V25=$(echo "$TAGS" | grep -oE 'v25\.12\.[0-9]+' | sed 's/^v//' | sort -V | tail -1)
          # API 失败时兜底
          [ -z "$V24" ] && V24="24.10.8"
          [ -z "$V25" ] && V25="25.12.5"
          echo "Latest: 24.x=$V24 25.x=$V25"
          echo "versions=[\"$V24\",\"$V25\"]" >> "$GITHUB_OUTPUT"

  # ---- 编译：三架构 x 版本矩阵，只产出 ipk/apk 并上传 artifact ----
  build:
    needs: detect
    name: Build ${{ matrix.arch }} @ ${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
        version: ${{ fromJSON(needs.detect.outputs.versions) }}
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Free disk space
        uses: sbwml/actions@free-disk

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # ---- 根据下拉选择映射包列表，并定义 SKIP_BUILD ----
      - name: Build package selection
        id: select
        run: |
          case "${{ inputs.packages }}" in
            "🎨 Argon 主题")
              PKGS="luci-theme-argon luci-app-argon-config"
              ;;
            "🎨 Kucat 主题")
              PKGS="luci-theme-kucat luci-app-kucat-config"
              ;;
            "🎨 Aurora 主题")
              PKGS="luci-theme-aurora luci-app-aurora-config"
              ;;
            "🎨 Design 主题")
              PKGS="luci-theme-design"
              ;;
            "🎨 Shadcn 主题")
              PKGS="luci-theme-shadcn"
              ;;
            "🔀 Mosdns DNS 转换器")
              PKGS="mosdns luci-app-mosdns v2dat"
              ;;
            "🚀 OpenClash 代理插件")
              PKGS="luci-app-openclash"
              ;;
            "🚀 HomeProxy 代理插件")
              PKGS="luci-app-homeproxy"
              ;;
            "🚀 PassWall 代理插件")
              PKGS="luci-app-passwall"
              ;;
            "🚀 PassWall2 代理插件")
              PKGS="luci-app-passwall2"
              ;;
            "🚀 Nikki 代理插件")
              PKGS="luci-app-nikki mihomo-meta"
              ;;
            "🧩 HelloWorld 代理内核组件")
              PKGS="chinadns-ng dns2socks microsocks tcping xray-core xray-plugin sing-box hysteria naiveproxy shadowsocks-rust shadow-tls simple-obfs v2ray-geodata v2ray-plugin"
              ;;
            "🔧 DiskMan 磁盘管理工具")
              PKGS="luci-app-diskman"
              ;;
            "🔧 MentoHUST 认证")
              PKGS="luci-app-mentohust mentohust"
              ;;
            "🔧 Quickfile 文件管理")
              PKGS="luci-app-quickfile quickfile"
              ;;
            "🔧 RamFree 内存清理")
              PKGS="luci-app-ramfree"
              ;;
            "🔧 Bandix-Plus 网络流量监控")
              PKGS="luci-app-bandix-plus bandix-plus"
              ;;
            "🔧 OpenList 网盘聚合工具")
              PKGS="luci-app-openlist2 openlist2"
              ;;
            "🔧 AirConnect 音频服务")
              PKGS="luci-app-airconnect airconnect"
              ;;
            "🌡️ Autocore 硬件信息")
              PKGS="autocore"
              ;;
            *)
              echo "::error::未识别的选项：${{ inputs.packages }}"
              exit 1
              ;;
          esac

          # 不跳过任何架构/版本
          echo "SKIP_BUILD=0" >> "$GITHUB_ENV"
          echo "PACKAGES=$PKGS" >> "$GITHUB_ENV"
          echo "SELECTED=${{ inputs.packages }}" >> "$GITHUB_ENV"
          echo "Selected packages: $PKGS"

      # ---- 用 SDK 镜像编译（MinimaxFlora/gh-action-sdk@go1.26）----
      - name: Build Packages
        if: ${{ env.SKIP_BUILD == '0' }}
        uses: MinimaxFlora/gh-action-sdk@go1.26
        env:
          ARCH: ${{ env.ARCH }}-${{ matrix.version }}
          FEEDNAME: packages_ci
          PACKAGES: ${{ env.PACKAGES }}
          NO_REFRESH_CHECK: true
          IGNORE_ERRORS: true

      # ---- 只收集本仓库编译的产物（packages_ci + nonshared 包），不打包 ----
      - name: Collect packages
        run: |
          mkdir -p release
          # 常规包 (packages_ci feed)
          find "bin/packages/${{ env.ARCH }}/packages_ci" -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} release/ \; || true
          # nonshared 包 (autocore 等): 输出在 bin/targets/<target>/<subtarget>/packages/
          find "bin/targets" -type f \( -name '*.ipk' -o -name '*.apk' \) -exec cp {} release/ \; || true
          if [ -z "$(ls -A release)" ]; then
            echo "构建无产物" > release/EMPTY.txt
          fi
          ls -lh release/

      # ---- 上传 artifact 供 release job 汇总 ----
      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packages-${{ matrix.arch }}-${{ matrix.version }}
          path: release
          if-no-files-found: warn

  # ---- 发布：按架构汇总 24.x + 25.x 产物，删除旧 release/tag 后重建 ----
  release:
    needs: [detect, build]
    name: Release ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
    env:
      TAG: ${{ matrix.arch }}

    steps:
      - name: Download all artifacts for ${{ matrix.arch }}
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: packages-${{ matrix.arch }}-*
          merge-multiple: true
          path: release

      - name: Check collected files
        run: ls -lh release/

      # ---- 先删除已有的 tag + release（每次重新创建，避免残留；减少 API 调用）----
      - name: Delete existing tag & release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 不预检，直接尝试删除，不存在时忽略错误（省一次 API 调用）
          if gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null; then
            echo "已删除旧的 release/tag: $TAG"
          else
            echo "没有旧 release，直接创建: $TAG"
          fi

      # ---- 以架构名创建全新 tag + release，上传 ipk/apk ----
      - name: Create tag & release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            OpenWrt ${{ matrix.arch }} · 自动构建
            版本: ${{ join(fromJSON(needs.detect.outputs.versions), ' / ') }}
            插件: ${{ inputs.packages }}
            由手动触发构建生成
          files: release/**/*
          fail_on_unmatched_files: false
